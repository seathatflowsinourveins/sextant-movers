version: 2
updates:
  - package-ecosystem: npm
    directories: [/.devcontainer/agents, /config/dsh]
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
  # The engine and the broker SDK move only with their own reviewed PR, at Sextant's pin.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: nautilus-trader
      - dependency-name: alpaca-py
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
    cooldown: { default-days: 14 }
    open-pull-requests-limit: 2
